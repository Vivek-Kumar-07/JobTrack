<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Application - JobTrack</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            JobTrack
        </div>

        <div class="nav-links">

            <a href="/">Dashboard</a>

            <a href="/#add-application">Add Application</a>

            <span>Welcome, {{ session["username"] }}</span>

            <a href="/logout">Logout</a>

        </div>

    </nav>

    <div class="container">

        <h1>JobTrack</h1>

        <p>Track your job and internship applications in one place.</p>

        <h2>Edit Application</h2>

        <form method="POST">

            <label>Company Name</label>
            <input
                type="text"
                name="company"
                value="{{ application['company'] }}"
                required
            >

            <label>Job Role</label>
            <input
                type="text"
                name="role"
                value="{{ application['role'] }}"
                required
            >

            <label>Status</label>
            <select name="status" required>

                <option value="Applied"
                    {% if application['status'] == 'Applied' %}selected{% endif %}>
                    Applied
                </option>

                <option value="Interview"
                    {% if application['status'] == 'Interview' %}selected{% endif %}>
                    Interview
                </option>

                <option value="Rejected"
                    {% if application['status'] == 'Rejected' %}selected{% endif %}>
                    Rejected
                </option>

                <option value="Offer"
                    {% if application['status'] == 'Offer' %}selected{% endif %}>
                    Offer
                </option>

            </select>

            <label>Application Date</label>
            <input
                type="date"
                name="date"
                value="{{ application['date'] }}"
                required
            >

              <label>Notes</label>

              <textarea
                 name="notes"
                rows="4"
                   placeholder="Add notes about this application..."
                 >{{ application['notes'] or '' }}</textarea>

                <!-- Interview Details -->

{% if application['status'] == 'Interview' %}

<div class="interview-section">

    <h3>Interview Details</h3>

    <label>Interview Date</label>

    <input
        type="date"
        name="interview_date"
        value="{{ application['interview_date'] or '' }}"
    >

    <label>Interview Time</label>

    <input
        type="time"
        name="interview_time"
        value="{{ application['interview_time'] or '' }}"
    >

    <label>Interview Type</label>

    <select name="interview_type">

        <option value="">Select interview type</option>

        <option value="Online"
            {% if application['interview_type'] == 'Online' %}selected{% endif %}>
            Online
        </option>

        <option value="Phone"
            {% if application['interview_type'] == 'Phone' %}selected{% endif %}>
            Phone
        </option>

        <option value="Technical"
            {% if application['interview_type'] == 'Technical' %}selected{% endif %}>
            Technical
        </option>

        <option value="HR"
            {% if application['interview_type'] == 'HR' %}selected{% endif %}>
            HR
        </option>

        <option value="In-person"
            {% if application['interview_type'] == 'In-person' %}selected{% endif %}>
            In-person
        </option>

    </select>

</div>

{% endif %}

<label>Next Follow-up</label>

<input
    type="date"
    name="follow_up_date"
    value="{{ application['follow_up_date'] or '' }}"

    <label>Company Website</label>

<input
    type="url"
    name="company_url"
    value="{{ application['company_url'] or '' }}"
    placeholder="https://company.com"
>


<label>Job Posting URL</label>

<input
    type="url"
    name="job_url"
    value="{{ application['job_url'] or '' }}"
    placeholder="https://company.com/jobs/..."
>


            <div class="edit-buttons">

                <button type="submit">
                    Update Application
                </button>

                <a href="/" class="cancel-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</body>

</html>
